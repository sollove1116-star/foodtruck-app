<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCF9F0">
<title>오늘의 푸드트럭 · 샘마을대우한양아파트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF9F0; --panel:#FFFDF6; --line:#D9CFB2;
  --text:#26331F; --muted:#5F665A; --sky:#7EC0EC; --lit:#2E7D4F; --lit-ink:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 "Noto Sans KR",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font:400 30px/1.2 "Black Han Sans","Noto Sans KR",sans-serif;margin:0 0 4px;display:flex;align-items:center;gap:10px}
h1 svg{width:38px;height:38px;flex:none;color:var(--lit)}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;min-height:72px;
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;cursor:pointer}
.wd .n{font-size:12px;color:var(--muted)}
.wd .d{font-weight:700;font-size:17px;line-height:1.2}
.wd .c{font-size:11px;color:var(--muted)}
.wd.has .c{color:var(--lit);font-weight:700}
.wd.now .d::after{content:"";display:block;height:2px;margin-top:1px;background:var(--lit);border-radius:2px}
.wd.sel{background:var(--lit);border-color:var(--lit);color:var(--lit-ink)}
.wd.sel .n,.wd.sel .c,.wd.has.sel .c{color:var(--lit-ink)}
.wd:focus-visible{outline:3px solid var(--lit);outline-offset:2px}
.day{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.day button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;
  min-width:44px;height:44px;font:inherit;cursor:pointer}
.day button:focus-visible,.add:focus-visible{outline:3px solid var(--lit);outline-offset:2px}
.day .label{flex:1;text-align:center;font-weight:700}
.day .today{font-size:13px;padding:0 12px}
.lot{display:grid;gap:10px}
.card{display:grid;grid-template-columns:88px 1fr;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.photo{width:88px;height:88px;border-radius:10px;border:1px solid var(--line);background:#fff;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:46px;height:46px;color:var(--sky)}
.name{font-weight:700;font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.time{display:inline-block;background:var(--lit);color:var(--lit-ink);border-radius:6px;
  padding:0 8px;font-size:13px;font-weight:700}
.loc{display:inline-block;border:1px solid var(--lit);color:var(--lit);border-radius:6px;
  padding:0 8px;font-size:13px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;
  font:500 14px/1 "Noto Sans KR",sans-serif;cursor:pointer;text-decoration:none}
.btn.menu{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.menu::after{content:"";width:7px;height:7px;border:solid var(--lit);border-width:0 2px 2px 0;
  transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.btn.menu[aria-expanded="true"]::after{transform:rotate(-135deg) translateY(-2px)}
.btn.call{background:var(--lit);color:var(--lit-ink);border:1px solid var(--lit);font-weight:700}
.btn:focus-visible{outline:3px solid var(--lit);outline-offset:2px}
.list{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:14px}
.list[hidden]{display:none}
.item{color:var(--text);padding:3px 0}
.msg{text-align:center;color:var(--muted);padding:24px 0}
.add{display:block;text-align:center;margin-top:24px;padding:14px;border-radius:12px;
  background:var(--lit);color:var(--lit-ink);font-weight:700;text-decoration:none}
.add[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h26v22H4z"/><path d="M30 20h9l5 7v7H30"/><path d="M34 22v5h8"/><path d="M9 18h12v6H9z"/><circle cx="13" cy="36" r="4" fill="#FCF9F0"/><circle cx="36" cy="36" r="4" fill="#FCF9F0"/></svg>오늘의 푸드트럭</h1>
  <p class="sub">샘마을대우한양아파트 주민들이 함께 채워가는 푸드트럭 소식이에요.</p>
  <div id="week" class="week" role="group" aria-label="이번 주 일정"></div>
  <div class="day">
    <button id="prev" aria-label="전날">‹</button>
    <div class="label" id="label" aria-live="polite"></div>
    <button id="next" aria-label="다음날">›</button>
    <button id="today" class="today">오늘</button>
  </div>
  <div id="lot" class="lot"></div>
  <p id="msg" class="msg" hidden></p>
  <a id="add" class="add" hidden target="_blank" rel="noopener">트럭 소식 알리기</a>
</main>

<script>
/* ===== 여기만 고치세요 ===== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKNt-Nacw9SwbqurM7ktSvNIXinJxvpZGYKef73KTRc8N4vRDcFYFzqOSJscOtmmCTL64wuOlNHoyz/pub?output=csv";   // 구글 시트 "웹에 게시" CSV 주소
const FORM_URL      = "https://forms.gle/Qyk4Cv5MzTWH73id7";   // 구글 폼 주소 (비우면 버튼이 숨겨져요)
/* ========================== */

const DEMO = [
  {date:todayKey(0),name:"청춘 닭꼬치",menu:"닭꼬치 3,000원\n소떡소떡 2,500원",time:"17:00–21:00",loc:"111동 앞",phone:"01000000000"},
  {date:todayKey(0),loc:"107동 옆",name:"달콤 붕어빵",menu:"팥 붕어빵 3개 2,000원\n슈크림 붕어빵 3개 2,000원",time:"16:30–20:00"},
  {date:todayKey(0),name:"옥수수 아저씨",menu:"찰옥수수 1개 3,000원",time:"21:00–22:00"},
  {date:todayKey(1),name:"타코 트럭",menu:"타코 2개 6,000원\n부리토 7,000원",time:"17:00–21:00"}
];

let rows = [], offset = 0, failed = false;
const $ = id => document.getElementById(id);

function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(off){const d=new Date();d.setDate(d.getDate()+off);return keyOf(d)}

function parseCSV(text){
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++}
      else if(c==='"')q=false;
      else cell+=c;
    }else if(c==='"')q=true;
    else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"){row.push(cell);out.push(row);row=[];cell=""}
    else if(c!=="\r")cell+=c;
  }
  if(cell||row.length){row.push(cell);out.push(row)}
  return out;
}

function normDate(s){
  s=(s||"").trim();
  let m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m)return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return m[3]+"-"+pad(+m[1])+"-"+pad(+m[2]);
  return "";
}

function toRows(table){
  const head=table[0].map(h=>h.trim());
  const col=k=>head.findIndex(h=>h.includes(k));
  const ix={date:col("날짜"),photo:col("사진"),name:col("트럭"),menu:col("메뉴"),time:col("시간"),loc:col("위치"),phone:col("전화")};
  return table.slice(1).map(r=>({
    date:normDate(r[ix.date]),
    photo:ix.photo<0?"":(r[ix.photo]||"").trim(),
    name:(r[ix.name]||"").trim(),
    menu:(r[ix.menu]||"").trim(),
    time:(r[ix.time]||"").trim(),
    loc:ix.loc<0?"":(r[ix.loc]||"").trim(),
    phone:ix.phone<0?"":(r[ix.phone]||"").replace(/[^\d+]/g,"")
  })).filter(r=>r.date&&r.name);
}

function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;   // 주민 입력은 항상 텍스트로만 표시
  return e;
}

const ICON='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h26v22H4z"/><path d="M30 20h9l5 7v7H30"/><path d="M34 22v5h8"/><path d="M9 18h12v6H9z"/><circle cx="13" cy="36" r="4" fill="#fff"/><circle cx="36" cy="36" r="4" fill="#fff"/></svg>';

function photoUrl(v){
  if(!v)return "";
  const g=v.match(/drive\.google\.com.*?(?:[?&]id=|\/d\/)([\w-]{10,})/);
  if(g)return "https://drive.google.com/thumbnail?id="+g[1]+"&sz=w400";
  if(/^https?:\/\//i.test(v))return v;
  if(/^[^\/\\:]+\.(jpe?g|png|webp|gif)$/i.test(v))return "photos/"+encodeURIComponent(v);
  return "";
}

function photo(t){
  const box=el("div","photo");
  const url=photoUrl(t.photo);
  const fallback=()=>{box.innerHTML=ICON};
  if(!url){fallback();return box}
  const img=document.createElement("img");
  img.alt=t.name+" 사진";img.loading="lazy";
  img.onerror=fallback;
  img.src=url;
  box.appendChild(img);
  return box;
}

function render(){
  const d=new Date();d.setDate(d.getDate()+offset);
  const key=keyOf(d);
  const names=["일","월","화","수","목","금","토"];
  $("label").textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+names[d.getDay()]+")"+(offset===0?" · 오늘":"");
  const wk=$("week");wk.replaceChildren();
  const base=new Date();base.setHours(0,0,0,0);
  const sun=new Date(d);sun.setHours(0,0,0,0);sun.setDate(sun.getDate()-sun.getDay());
  for(let i=0;i<7;i++){
    const w=new Date(sun);w.setDate(sun.getDate()+i);
    const k=keyOf(w);
    const cnt=new Set(rows.filter(r=>r.date===k).map(r=>r.name)).size;
    const diff=Math.round((w-base)/86400000);
    const b=el("button","wd"+(cnt?" has":"")+(diff===0?" now":"")+(k===key?" sel":""));
    b.type="button";
    b.setAttribute("aria-label",(w.getMonth()+1)+"월 "+w.getDate()+"일 "+names[w.getDay()]+"요일, 트럭 "+cnt+"대");
    if(k===key)b.setAttribute("aria-current","date");
    b.appendChild(el("span","n",names[w.getDay()]));
    b.appendChild(el("span","d",String(w.getDate())));
    b.appendChild(el("span","c",cnt?cnt+"대":"–"));
    b.onclick=()=>{offset=diff;render()};
    wk.appendChild(b);
  }
  const lot=$("lot");lot.replaceChildren();
  const day=rows.filter(r=>r.date===key);
  day.slice().sort((a,b)=>(a.time||"").localeCompare(b.time||"")).forEach(t=>{
      const card=el("div","card");
      card.appendChild(photo(t));
      const box=el("div","truck");
      const n=el("div","name",t.name);
      if(t.time)n.appendChild(el("span","time",t.time));
      if(t.loc)n.appendChild(el("span","loc",t.loc));
      box.appendChild(n);
      const hasMenu=!!t.menu, hasPhone=(t.phone||"").length>=8;
      if(hasMenu||hasPhone){
        const row=el("div","actions");
        let list=null;
        if(hasMenu){
          const b=el("button","btn menu","메뉴 보기");
          b.type="button";b.setAttribute("aria-expanded","false");
          list=el("div","list");list.hidden=true;
          t.menu.split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>list.appendChild(el("div","item",x)));
          b.onclick=()=>{const open=list.hidden;list.hidden=!open;b.setAttribute("aria-expanded",open)};
          row.appendChild(b);
        }
        if(hasPhone){
          const a=el("a","btn call");
          a.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
          a.appendChild(document.createTextNode("예약하기"));
          a.setAttribute("aria-label","예약하기, 전화 연결");
          a.href="tel:"+t.phone;
          row.appendChild(a);
        }
        box.appendChild(row);
        if(list)box.appendChild(list);
      }
      card.appendChild(box);
      lot.appendChild(card);
  });
  if(!failed){
    $("msg").hidden=day.length>0;
    $("msg").textContent="아직 등록된 트럭이 없어요. 알고 계시면 알려주세요.";
  }
}

async function load(){
  if(!SHEET_CSV_URL){rows=DEMO;render();return}
  try{
    const res=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());
    if(!res.ok)throw new Error(res.status);
    rows=toRows(parseCSV(await res.text()));
  }catch(e){
    rows=[];failed=true;$("msg").hidden=false;$("msg").textContent="소식을 불러오지 못했어요. 잠시 후 다시 열어주세요.";
  }
  render();
}

$("prev").onclick=()=>{offset--;render()};
$("next").onclick=()=>{offset++;render()};
$("today").onclick=()=>{offset=0;render()};
if(FORM_URL){$("add").href=FORM_URL;$("add").hidden=false}
load();
</script>
</body>
</html>
